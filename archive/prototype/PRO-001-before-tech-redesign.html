<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>行间 · 工作手册 | PRO-001</title><style>
:root{--paper:#f6f5ef;--white:#fffefa;--ink:#263c35;--muted:#7b8178;--line:#dddfd5;--green:#264c3c;--lime:#d9ebad}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:14px "Microsoft YaHei UI","PingFang SC",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:transparent;border-radius:6px;padding:9px 13px}button:hover{background:#e8eddf}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #739454;outline-offset:3px}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--green);color:#fff;border-color:var(--green)}.primary:hover{background:#38644d}.quiet{border:0;color:var(--muted)}header{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.brand{font:26px Georgia,"SimSun",serif;letter-spacing:4px}.brand small{font:10px Georgia;letter-spacing:2px;color:var(--muted);margin-left:18px}.stamp{font-size:11px;letter-spacing:2px;color:var(--muted)}.shell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 78px)}aside{padding:30px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted)}.sideTitle{display:flex;align-items:center;justify-content:space-between}.goal{width:100%;text-align:left;margin-bottom:7px;border:0;padding:13px}.goal.active{background:var(--green);color:white}.modules{padding:5px 0 5px 16px;border-left:1px solid var(--line);margin-left:12px}.module{display:block;width:100%;text-align:left;border:0;margin:4px 0}.module.active{background:#e4e9d9}.asideFoot{margin-top:auto;padding-top:32px;font-size:12px;color:var(--muted);line-height:1.9}main{padding:35px 42px 24px;min-width:0}.intro{display:flex;justify-content:space-between;align-items:end;margin:14px 0 32px}h1{font:36px "SimSun",Georgia,serif;margin:14px 0;letter-spacing:2px}p{line-height:1.8;color:var(--muted)}.folio{font:58px Georgia;color:#c9cebf}.workspace{display:grid;grid-template-columns:280px minmax(0,1fr);background:var(--white);border:1px solid var(--line);border-radius:10px;min-height:490px;overflow:hidden}.things{padding:24px 18px;border-right:1px solid var(--line);background:#f0f1e9}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.thing{width:100%;padding:18px;text-align:left;margin-bottom:10px;background:#fafaf4;border:1px solid transparent}.thing.active{background:var(--white);border-color:#8d9d7a;box-shadow:0 3px 10px #263c3508}.thing strong{display:block;font-size:15px}.thing small{display:block;color:var(--muted);line-height:1.6;margin-top:8px}.events{padding:28px;min-width:0}.events h2{font:25px "SimSun",serif;margin:10px 0}.badge{font-size:11px;padding:4px 8px;border-radius:4px;background:#edf0e5;color:#5e7153}.event{display:flex;gap:14px;padding:19px 0;border-top:1px solid var(--line);align-items:start}.check{width:24px;height:24px;padding:0;border-radius:50%;flex-shrink:0;margin-top:3px}.done .check{background:var(--green);color:white}.eventText{flex:1;min-width:0}.eventText strong{font-weight:500;overflow-wrap:anywhere}.eventText p{font-size:12px;margin:7px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.done strong{text-decoration:line-through;color:var(--muted)}.event .quiet{font-size:12px;padding:5px}.listHead{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px;font-size:12px;color:var(--muted)}.empty{text-align:center;padding:48px 12px;color:var(--muted);line-height:2}.empty b{display:block;color:var(--ink);font:24px "SimSun";margin-bottom:16px}footer{display:flex;justify-content:space-between;gap:20px;margin-top:22px;font-size:11px;color:var(--muted)}details{font-size:12px}summary{cursor:pointer}details .controls{display:flex;gap:8px;align-items:center;padding:15px 0;flex-wrap:wrap}select{padding:7px;border:1px solid var(--line);background:var(--white);color:var(--ink)}dialog{border:1px solid var(--line);border-radius:12px;background:var(--white);padding:30px;width:min(480px,90vw);color:var(--ink);box-shadow:0 25px 100px #142c3629}dialog::backdrop{background:#162e2866;backdrop-filter:blur(3px)}dialog h2{font:26px "SimSun";margin-top:0}label{display:block;margin:20px 0 8px}input,textarea{width:100%;border:1px solid #cbd0c2;border-radius:5px;padding:12px;background:white;color:var(--ink)}textarea{height:100px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.error{color:#a43e2f;font-size:13px;line-height:1.7}#notice{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:12px 22px;border-radius:8px;z-index:5;max-width:90vw}#notice:empty{display:none}.intro,.workspace{animation:enter .45s ease both}.workspace{animation-delay:.08s}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:1050px){main{padding:24px}.workspace{grid-template-columns:220px 1fr}.shell{grid-template-columns:210px 1fr}.events{padding:20px}}@media(max-width:760px){header{padding:0 20px}.brand small,.folio{display:none}.shell{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:18px;gap:12px}.asideFoot{display:none}.workspace{grid-template-columns:1fr}.things{border-right:0;border-bottom:1px solid var(--line)}main{padding:20px}.intro{align-items:start}h1{font-size:28px}footer{flex-direction:column}.stamp{font-size:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 0;font-size:12px;color:var(--muted)}.meta span{line-height:1.8}.status{display:inline-block;border-radius:4px;padding:2px 8px;background:#eef0e7;color:#55634c}.status.working{background:#e8efce;color:#53672b}.status.completed{background:#deebe3;color:#315b46}.status.cancelled{background:#eee7e2;color:#8a7061}.fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.fieldGrid select{width:100%;padding:12px}dialog{max-height:90vh;overflow:auto} .thing .meta{display:block}.thing .meta span{display:block}@media(max-width:480px){.fieldGrid{grid-template-columns:1fr}}</style></head><body><header><div class="brand">行间<span style="color:#93a66c"> /</span><small>WORK, WITH INTENTION</small></div><div class="stamp">个人工作手册 &nbsp; / &nbsp; 交互原型 01</div></header><div class="shell"><aside><div class="sideTitle"><span class="eyebrow">我的目标 / GOALS</span><button class="quiet" onclick="openForm('goal')" aria-label="新建目标">＋</button></div><nav id="nav" aria-label="目标与模块"></nav><button onclick="openForm('goal')">＋ 新建目标</button><div class="asideFoot">把目标放在心里，<br>把下一步落在这里。<br><br>○ 个人空间 · 本地演示</div></aside><main><div class="eyebrow" id="crumb"></div><div class="intro"><div><h1 id="heading"></h1><p id="introText"></p><button class="quiet" id="editModule" onclick="openForm('module',selection.module)">编辑模块 ↗</button></div><span class="folio">01<span style="font-size:16px"> / 工作</span></span></div><div class="workspace"><section class="things"><div class="sectionHead"><span>事情 <span id="thingCount" class="badge"></span></span><button id="addThing" class="quiet" onclick="openForm('thing')">＋ 新建</button></div><div id="things"></div></section><section class="events" id="events"></section></div><footer><span>PRO-001 · 示例数据仅用于评审，修改保存在当前浏览器</span><span>目标 → 模块 → 事情 → 事件</span></footer><details style="margin-top:22px"><summary>原型评审工具</summary><div class="controls"><label style="margin:0" for="simulation">下一次保存模拟</label><select id="simulation"><option value="">正常保存</option><option value="denied">无操作权限</option><option value="missing">父项已失效</option><option value="conflict">状态冲突</option><option value="write">保存失败</option><option value="read">结果无法确认</option></select><button onclick="switchDemo(true)">体验空白空间</button><button onclick="switchDemo(false)">恢复示例</button><span>切换会替换原型演示数据，需再次确认。</span></div></details></main></div><dialog id="editor"><form id="form" novalidate><h2 id="formTitle"></h2><p id="formContext"></p><label for="name">名称 <span style="color:#a43e2f">*</span></label><input id="name" maxlength="120" autocomplete="off"><label for="description">说明 <span style="color:#7b8178">（可选）</span></label><textarea id="description"></textarea><div id="workFields"><div class="fieldGrid"><div><label for="planStart">计划开始时间</label><input id="planStart" type="datetime-local"></div><div><label for="planEnd">计划结束时间</label><input id="planEnd" type="datetime-local"></div><div><label for="owner">责任人</label><input id="owner" placeholder="填写姓名" maxlength="80"></div><div><label for="status">状态</label><select id="status"><option value="notStarted">未开始</option><option value="working">进行中</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select></div></div></div><div id="formError" class="error" role="alert"></div><div class="actions"><button type="button" onclick="editor.close()">取消</button><button class="primary" id="save" type="submit">保存</button></div></form></dialog><div id="notice" role="status" aria-live="polite"></div><script>
const KEY='todo-pro-001-v1', names={goal:'目标',module:'模块',thing:'事情',event:'事件'}, parentType={module:'goal',thing:'module',event:'thing'};
const sample=()=>({revision:0,items:[{id:'g1',type:'goal',name:'让工作有序推进',description:'从清晰的目标，到可以完成的下一步。'},{id:'g2',type:'goal',name:'建立个人知识体系',description:'把零散的积累变成可复用的经验。'},{id:'m1',type:'module',parent:'g1',name:'产品从想法到落地',description:'把抽象的构想，逐步变成可以使用的产品。'},{id:'m2',type:'module',parent:'g1',name:'日常工作与沟通',description:'让每一次沟通都有明确的下一步。'},{id:'t1',type:'thing',parent:'m1',name:'打磨第一版工作闭环',description:'先让记录、组织和完成变得自然。'},{id:'t2',type:'thing',parent:'m1',name:'梳理典型使用场景',description:'从真实工作中找到产品的边界。'},{id:'e1',type:'event',parent:'t1',name:'体验目标到事件的创建流程',description:'试着新建一件事情，再为它记录一个具体行动。',done:false},{id:'e2',type:'event',parent:'t1',name:'检查事件完成后的展示',description:'点击左侧圆圈完成；再次点击可以撤销完成。',done:false},{id:'e3',type:'event',parent:'t1',name:'明确首个切片的范围',description:'聚焦手动组织工作与事件完成。',done:true}]});
const states={notStarted:'未开始',working:'进行中',completed:'已完成',cancelled:'已取消'};
const statusOf=x=>x.status||(x.done?'completed':'notStarted');
const pending=x=>['notStarted','working'].includes(statusOf(x));
function metadata(x){return `<div class="meta"><span class="status ${statusOf(x)}">${states[statusOf(x)]}</span><span>责任人 · ${esc(x.owner)||'未指定'}</span><span>计划开始 · ${esc(x.planStart?.replace('T',' '))||'未设置'}</span><span>计划结束 · ${esc(x.planEnd?.replace('T',' '))||'未设置'}</span></div>`}
let db,selection={goal:'g1',module:'m1',thing:'t1'},editing=null,busy=false;
try{db=JSON.parse(localStorage.getItem(KEY))||sample();if(!Array.isArray(db.items))throw Error();}catch{db=sample();setTimeout(()=>notify('本地数据读取失败，当前展示临时示例。'),100)}
const $=s=>document.querySelector(s), esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),get=id=>db.items.find(x=>x.id===id), children=(type,parent)=>db.items.filter(x=>x.type===type&&(!parent||x.parent===parent));
function notify(s){$('#notice').textContent=s;clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>$('#notice').textContent='',4500)}
function normalize(){for(const type of ['goal','module','thing']){let p=parentType[type];let list=db.items.filter(x=>x.type===type&&(!p||x.parent===selection[p]));if(!list.some(x=>x.id===selection[type]))selection[type]=list[0]?.id||null}}
function select(type,id){selection[type]=id;render()}
function render(){normalize();let g=get(selection.goal),m=get(selection.module),t=get(selection.thing);$('#nav').innerHTML=children('goal').map(x=>`<button class="goal ${x.id===g?.id?'active':''}" onclick="select('goal','${x.id}')">◈ &nbsp; ${esc(x.name)}</button>${x.id===g?.id?`<div class="modules">${children('module',x.id).map(y=>`<button class="module ${y.id===m?.id?'active':''}" onclick="select('module','${y.id}')">${esc(y.name)}</button>`).join('')}<button class="module quiet" onclick="openForm('module')">＋ 新建模块</button><button class="module quiet" onclick="openForm('goal','${x.id}')">编辑目标 ↗</button></div>`:''}`).join('');$('#crumb').textContent=g?`我的目标 / ${g.name}`:'我的目标 / 从这里开始';$('#heading').textContent=m?.name||g?.name||'给下一步一个方向';$('#introText').textContent=m?.description||g?.description||'创建第一个目标，开始组织你的工作。';$('#editModule').hidden=!m;$('#addThing').disabled=!m;let ts=m?children('thing',m.id):[];$('#thingCount').textContent=ts.length;$('#things').innerHTML=ts.length?ts.map(x=>`<button class="thing ${x.id===t?.id?'active':''}" onclick="select('thing','${x.id}')"><strong>${esc(x.name)}</strong><small>${esc(x.description)||'暂无说明'}</small>${metadata(x)}<small>${children('event',x.id).filter(pending).length} 个待完成事件 &nbsp; →</small></button>`).join(''):`<div class="empty">${m?'还没有事情<br>点击上方「新建」开始。':g?'先在左侧创建模块。':'先在左侧创建目标。'}</div>`;if(!t){$('#events').innerHTML='<div class="empty"><b>从一件事情开始</b>在左侧创建或选择事情，<br>把它变成一个个可执行的行动。</div>';return}let es=children('event',t.id);$('#events').innerHTML=`<div class="sectionHead"><span class="eyebrow">当前事情 / FOCUS</span><button class="quiet" onclick="openForm('thing','${t.id}')">编辑事情 ↗</button></div><h2>${esc(t.name)}</h2><p>${esc(t.description)||'为这件事情记录具体行动。'}</p>${metadata(t)}<div class="listHead"><span>行动清单 · ${es.filter(pending).length} 待完成 / ${es.filter(x=>statusOf(x)==='completed').length} 已完成</span><button class="primary" onclick="openForm('event')">＋ 新建事件</button></div>${es.length?es.map(x=>`<div class="event ${statusOf(x)==='completed'?'done':''}"><button class="check" ${statusOf(x)==='cancelled'?'disabled':''} aria-label="${statusOf(x)==='completed'?'撤销完成':'完成'}：${esc(x.name)}" onclick="toggle('${x.id}')">${statusOf(x)==='completed'?'✓':''}</button><div class="eventText"><strong>${esc(x.name)}</strong><p>${esc(x.description)}</p>${metadata(x)}</div><button class="quiet" onclick="openForm('event','${x.id}')">编辑</button></div>`).join(''):'<div class="empty"><b>下一步，做什么？</b>创建一个具体、可以完成的事件。</div>'}`}
function openForm(type,id){let item=get(id),p=parentType[type],parent=p?selection[p]:null;if(!id&&p&&!get(parent)){notify('请先选择有效的'+names[p]);return}editing={type,id,parent,revision:db.revision};$('#formTitle').textContent=(id?'编辑':'新建')+names[type];$('#formContext').textContent=item?.parent?'所属'+names[p]+'：'+get(item.parent)?.name:parent?'所属'+names[p]+'：'+get(parent).name:'用一句话描述你希望达成的结果。';$('#name').value=item?.name||'';$('#description').value=item?.description||'';$('#workFields').hidden=!['thing','event'].includes(type);$('#planStart').value=item?.planStart||'';$('#planEnd').value=item?.planEnd||'';$('#owner').value=item?.owner||'';$('#status').value=item?statusOf(item):'notStarted';$('#formError').textContent='';$('#editor').showModal();$('#name').focus()}
function persist(next){let mode=$('#simulation').value;$('#simulation').value='';const errors={denied:'没有当前对象的操作权限，未保存。',missing:'父项已失效，请关闭后重新选择归属。',conflict:'内容状态已变化，请重新打开后编辑。',write:'保存失败，输入已保留，请核对后再试。',read:'无法确认保存结果，请先核对内容；本次演示未写入。'};if(mode)throw Error(errors[mode]);let old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.revision!==db.revision)throw Error('另一页面已修改数据，请刷新后重新操作。');next.revision=db.revision+1;let raw=JSON.stringify(next);localStorage.setItem(KEY,raw);if(localStorage.getItem(KEY)!==raw)throw Error('结果无法确认，请重新打开核对。');db=JSON.parse(raw)}
$('#form').onsubmit=e=>{e.preventDefault();if(busy||!editing)return;let name=$('#name').value.trim();if(!name){$('#formError').textContent='请输入名称，不能只包含空格。';$('#name').focus();return}if(['thing','event'].includes(editing.type)&&$('#planStart').value&&$('#planEnd').value&&$('#planEnd').value<$('#planStart').value){$('#formError').textContent='计划结束时间不能早于计划开始时间。';return}busy=true;$('#save').disabled=true;try{if(editing.revision!==db.revision)throw Error('内容已变化，请重新打开编辑。');let next=structuredClone(db),item=next.items.find(x=>x.id===editing.id);if(editing.id&&!item)throw Error('对象已失效，请重新选择。');if(!item&&parentType[editing.type]&&!get(editing.parent))throw Error('父项不存在，未保存。');if(item){item.name=name;item.description=$('#description').value}else{item={id:'n'+crypto.randomUUID(),type:editing.type,parent:editing.parent,name,description:$('#description').value,done:false};next.items.push(item)}if(['thing','event'].includes(editing.type)){item.planStart=$('#planStart').value;item.planEnd=$('#planEnd').value;item.owner=$('#owner').value.trim();item.status=$('#status').value;item.done=item.status==='completed'}persist(next);if(editing.type!=='event')selection[editing.type]=item.id;editing=null;$('#editor').close();render();notify('已保存，并核对本地结果。')}catch(err){$('#formError').textContent=err.message}finally{busy=false;$('#save').disabled=false}};
function toggle(id){try{let next=structuredClone(db),item=next.items.find(x=>x.id===id);if(!item||item.type!=='event'||item.parent!==selection.thing)throw Error('事件不在当前事情内。');if(statusOf(item)==='cancelled')throw Error('已取消事件请通过编辑调整状态。');item.status=statusOf(item)==='completed'?'notStarted':'completed';item.done=item.status==='completed';persist(next);render();notify(item.done?'事件已完成；所属事情保持不变。':'已撤销完成，恢复为未开始。')}catch(err){notify(err.message)}}
function switchDemo(empty){if(!confirm('这会替换当前浏览器中的原型演示数据，是否继续？'))return;try{let next=empty?{revision:0,items:[]}:sample();persist(next);selection={};render();notify(empty?'已进入空白空间。':'已恢复示例。')}catch(err){notify(err.message)}}render();
</script></body></html>
