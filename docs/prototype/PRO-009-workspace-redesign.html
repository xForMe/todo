<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRO-009 · 工作空间视觉重构</title>
<style>*{box-sizing:border-box}body{margin:0;color:#253044;background:#f6f7f9;font:14px/1.6 'Microsoft YaHei UI',sans-serif}aside{position:fixed;inset:0 auto 0 0;width:220px;background:#172333;color:#dde5f0;padding:28px 20px}aside h1{font-size:24px}button,select{font:inherit;padding:10px 16px;border:1px solid #dfe4ec;border-radius:6px;background:white;color:inherit;cursor:pointer}aside button{display:block;width:100%;margin:12px 0;text-align:left;background:transparent;color:#dde5f0;border:0}main{margin-left:220px;padding:40px}.goals{background:white;padding:20px;border:1px solid #e3e7ee}.layout{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:28px}.panel{background:white;padding:24px}.row{padding:20px 0;border-top:1px solid #e3e7ee}.row p,small{color:#657185}.primary{background:#315bc7;color:white}dialog{position:fixed;inset:0 0 0 auto;margin:0;width:min(520px,100%);height:100vh;max-height:100vh;border:0;padding:32px}dialog::backdrop{background:#17233366}[hidden]{display:none!important}@media(max-width:768px){aside{position:static;width:auto;padding:16px}aside h1{margin:0}aside button{display:inline-block;width:auto}main{margin:0;padding:20px}.layout{grid-template-columns:1fr}}</style>
<aside><h1>行间</h1><small>目标与行动</small><button onclick="view('home')">工作台</button><button onclick="view('work')">目标与事情</button><button onclick="detail('来源设置','保留读取与 AI 授权的独立确认。')">来源设置</button></aside>
<main><small>个人工作空间 · 示例原型</small><h1 id="title">工作台</h1><p><select aria-label="目标范围" onchange="document.querySelector('.goals').textContent=this.value"><option>全部目标 · 示例目标</option><option>示例目标</option></select> <button onclick="state('empty')">演示空态</button> <button onclick="state('error')">演示读取失败</button> <button onclick="state('normal')">恢复示例</button></p><div id="message" role="status"></div><div id="content"><div class="goals">示例目标　2 模块　3 事情　1 已完成事情</div><div class="layout"><section class="panel"><h2 id="listTitle">行动清单</h2><button class="primary" onclick="document.querySelector('.row').hidden=false">全部未结束</button> <button onclick="document.querySelector('.row').hidden=true">已逾期 0</button><article class="row"><button onclick="detail('核对本周交付清单','示例目标 / 示例模块 / 示例事情')">核对本周交付清单</button><p>示例目标 / 示例模块 / 示例事情</p><small>进行中 · 未排期</small></article></section><div><section class="panel"><h2>持续关注</h2><p>还没有关注的事情</p><button onclick="view('work')">去选择事情</button></section><section class="panel"><h2>本周待评估</h2><button onclick="detail('事情优先级','选择优先级后明确确认本周评估。')">去评估</button></section></div></div></div></main><dialog><h2 id="detailTitle"></h2><p id="detailText"></p><button onclick="document.querySelector('dialog').close()">关闭</button></dialog><script>function view(v){document.querySelector('#title').textContent=v==='home'?'工作台':'目标与事情';document.querySelector('#listTitle').textContent=v==='home'?'行动清单':'事情与事件';state('normal')}function detail(t,d){document.querySelector('#detailTitle').textContent=t;document.querySelector('#detailText').textContent=d;document.querySelector('dialog').showModal()}function state(s){document.querySelector('#content').hidden=s!=='normal';document.querySelector('#message').textContent=s==='empty'?'还没有目标，请前往目标与事情新建。':s==='error'?'读取失败，统计暂不可用。请手动重试。':''}</script></html>
