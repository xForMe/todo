<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>行间 · 目标与行动 | PRO-001</title><style>
:root{color-scheme:dark;--bg:#061528;--panel:#092137;--line:#20506a;--cyan:#15d9ed;--text:#e8f4ff;--muted:#9ab8cb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 10%,#0c2940 0,transparent 65%),var(--bg);color:var(--text);font:14px "Microsoft YaHei UI","PingFang SC",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #3d819d;border-radius:6px;background:#0b293e;color:#c2edff;padding:10px 16px;transition:background .16s,border-color .16s}button:hover{background:#10415a;border-color:var(--cyan)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.primary{background:var(--cyan);color:#002434;border-color:var(--cyan);font-weight:600}.primary:hover{background:#69eafa}.quiet{background:transparent;border-color:transparent;padding:6px;color:#8bdcf2}.topbar{display:grid;grid-template-columns:1fr 380px 1fr;align-items:center;min-height:88px;background:#030e23;border-bottom:1px solid #21718c;padding:0 26px;gap:15px}.navGroup{display:flex;align-items:center;justify-content:space-between;gap:8px}.navGroup button{border:1px solid transparent;background:transparent;color:#e1f0fd;white-space:nowrap}.navGroup button.active{border-color:var(--cyan);color:var(--cyan);box-shadow:inset 0 0 18px #0ac9f527,0 0 8px #0ac9f51a}.navGroup button:disabled{opacity:.4}.brand{text-align:center;align-self:stretch;border-bottom:2px solid var(--cyan);background:linear-gradient(120deg,transparent,#10435b55,transparent);padding:13px 10px}.brand strong{font-size:27px;letter-spacing:3px}.brand small{display:block;letter-spacing:5px;font-size:10px;margin-top:9px;color:#a1cbdc}main{padding:22px 26px}.breadcrumb{color:#a0c7db;margin:2px 0 24px;font-size:13px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border:1px solid #2582a0;border-radius:8px;background:linear-gradient(100deg,#0b3449,#071e31);margin-bottom:24px}.toolbar label{font-size:15px;margin:0}.toolbar select{width:230px}.toolbar .spacer{flex:1}.workspace{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;min-height:650px}.panel{border:1px solid #1c7694;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#0c2b3fbb,#071a2c);min-width:0}.panelHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid #21566e;background:#0b344844}.panelHead h2{margin:0;font-size:19px;white-space:nowrap}.panelHead i{font-style:normal;color:var(--cyan);margin-right:8px}.panelHead h2 small{font-size:11px;color:var(--muted);font-weight:400;margin-left:10px}.panelHead button{padding:8px 12px}.micro{font-size:10px;letter-spacing:2px;color:#5f92a8}#things{padding:18px 14px}.thing{display:block;text-align:left;width:100%;margin-bottom:16px;padding:18px 16px;background:linear-gradient(125deg,#11334a,#0a2033);border-color:#2d5a71}.thing.active{border-color:var(--cyan);box-shadow:inset 3px 0 var(--cyan),inset 0 0 30px #00dbff0a}.cardTitle{display:flex;align-items:start;gap:8px;justify-content:space-between}.cardTitle strong{font-size:17px;line-height:1.5}.thing p{font-size:12px;line-height:1.7;color:var(--muted)}.cardMeta{display:grid;grid-template-columns:105px 1fr;gap:12px 3px;margin-top:20px;font-size:12px}.cardMeta span{color:var(--muted)}.cardMeta b{font-weight:400;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.status{display:inline-block;white-space:nowrap;border-radius:20px;padding:4px 12px;background:#304e66;color:#dceaf6;font-size:12px}.status.working{background:#0ccce2;color:#032838}.status.completed{background:#46dfb9;color:#063d34}.status.cancelled{background:#d9b766;color:#312207}.detail{padding:24px 20px}.detailTitle{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:28px;margin:0 0 12px;letter-spacing:1px}.detailTitle p{color:var(--muted);line-height:1.7;margin:0;white-space:pre-wrap}.detailTitle button{flex-shrink:0}.facts{display:grid;grid-template-columns:1.2fr 1.2fr 1fr .8fr;gap:12px;margin-top:26px}.facts>div{border:1px solid #2a5f78;border-radius:6px;padding:16px;background:linear-gradient(120deg,#10374c,#0b263b)}.facts label{display:block;color:var(--muted);margin:0 0 13px;font-size:12px}.facts strong{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}.tableWrap{padding:18px;overflow:auto}table{border-collapse:separate;border-spacing:0;width:100%;border:1px solid #315b72;border-radius:6px;overflow:hidden;text-align:left}th{background:#123c54;font-weight:500;font-size:12px;white-space:nowrap}th,td{padding:16px 12px;border-bottom:1px solid #24485f}td{font-size:12px;line-height:1.6;font-variant-numeric:tabular-nums}td:not(:first-child){white-space:nowrap}tbody tr:last-child td{border-bottom:0}tbody tr:nth-child(even){background:#0d2a3c55}tbody tr:hover{background:#11384b}th:first-child{width:35%}.eventName{display:flex;align-items:start;gap:10px;min-width:180px}.eventName small{display:block;color:#7e9cae;margin-top:6px;white-space:pre-wrap;font-size:11px}.check{padding:0;width:19px;height:19px;flex-shrink:0;border-radius:50%;margin-top:2px;font-size:12px;color:var(--cyan)}.empty{padding:80px 20px;text-align:center;color:var(--muted);line-height:2}.empty b{display:block;font-size:20px;margin-bottom:16px;color:var(--text)}footer{text-align:center;color:#6e97ac;font-size:11px;letter-spacing:1px;margin:24px 0 14px}footer:before,footer:after{content:'';display:inline-block;width:8%;height:1px;background:#15809b;margin:0 20px;vertical-align:middle}details{margin-top:22px;color:#86aabc;font-size:12px}summary{cursor:pointer}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0}select,input,textarea{border:1px solid #38647e;border-radius:5px;background:#071b2d;color:var(--text);padding:11px}input,textarea{width:100%}select{max-width:100%}textarea{height:85px;resize:vertical}label{display:block;margin:16px 0 8px}dialog{background:linear-gradient(135deg,#102f45,#071a2d);color:var(--text);border:1px solid #2397b1;border-radius:10px;box-shadow:0 25px 100px #0009;padding:28px;width:min(580px,92vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#010914b8;backdrop-filter:blur(5px)}dialog h2{margin:0;font-size:24px}dialog p{color:var(--muted);line-height:1.6}.fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.fieldGrid select{width:100%}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.error{color:#ffb295;line-height:1.7;margin-top:14px}#notice{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);padding:13px 24px;border:1px solid var(--cyan);background:#103749;color:#d8f6ff;border-radius:6px;z-index:5;max-width:90vw}#notice:empty{display:none}@media(min-width:1600px){.workspace{grid-template-columns:380px minmax(0,1fr)}td{font-size:14px}.facts strong{font-size:18px}}@media(max-width:1150px){.topbar{grid-template-columns:1fr;gap:8px;padding:12px}.brand{grid-row:1}.navGroup{justify-content:center}.workspace{grid-template-columns:260px minmax(0,1fr)}.facts{grid-template-columns:1fr 1fr}.detailTitle{align-items:start}.micro{display:none}.toolbar select{width:180px}}@media(max-width:760px){main{padding:16px}.workspace{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}.detailTitle{display:block}.detailTitle button{margin-top:15px}.toolbar .spacer{display:none}.toolbar select{flex:1;min-width:130px}.fieldGrid{grid-template-columns:1fr}.navGroup button{padding:8px}.brand strong{font-size:23px}h1{font-size:23px}.cardMeta{grid-template-columns:105px 1fr}}
</style></head><body><header class="topbar"><nav class="navGroup" aria-label="主导航"><button disabled title="后续规划，当前仅展示导航">▦ 工作台</button><button class="active" aria-current="page">◎ 目标与事情</button><button disabled title="后续规划">▤ 事件管理</button></nav><div class="brand"><strong>行间 · 目标与行动</strong><small>WORK WITH INTENTION</small></div><nav class="navGroup" aria-label="系统导航"><button disabled title="后续规划">▱ 资料中心</button><button disabled title="后续规划">⚙ 系统设置</button><button disabled title="个人空间展示占位">♙ 个人空间</button></nav></header><main><div class="breadcrumb" id="crumb"></div><section class="toolbar" aria-label="选择目标和模块"><label for="goalSelect">目标</label><select id="goalSelect" onchange="select('goal',this.value)"></select><button class="quiet" id="editGoal" onclick="openForm('goal',selection.goal)" aria-label="编辑当前目标">编辑</button><label for="moduleSelect">模块</label><select id="moduleSelect" onchange="select('module',this.value)"></select><button class="quiet" id="editModule" onclick="openForm('module',selection.module)" aria-label="编辑当前模块">编辑</button><span class="spacer"></span><button class="primary" onclick="openForm('goal')">＋ 新建目标</button><button id="newModule" onclick="openForm('module')">＋ 新建模块</button></section><div class="workspace"><section class="panel"><div class="panelHead"><h2><i>▱</i> 事情 <small id="thingCount"></small></h2><button id="addThing" onclick="openForm('thing')">＋ 新建事情</button></div><div id="things"></div></section><section class="panel" id="events"></section></div><footer>PRO-001 · 科技风交互原型 · 示例数据 · 待确认</footer><details><summary>原型说明与评审工具</summary><p>当前展示「目标与事情」切片；顶部灰色导航为后续规划占位。数据保存在当前浏览器，时间与责任人未填写时保持为空。</p><div class="controls"><label for="simulation">下一次保存模拟</label><select id="simulation"><option value="">正常保存</option><option value="denied">无操作权限</option><option value="missing">父项已失效</option><option value="conflict">状态冲突</option><option value="write">保存失败</option><option value="read">结果无法确认</option></select><button onclick="switchDemo(true)">体验空白空间</button><button onclick="switchDemo(false)">恢复示例</button></div></details></main><dialog id="editor"><form id="form" novalidate><h2 id="formTitle"></h2><p id="formContext"></p><label for="name">名称 <span style="color:#a43e2f">*</span></label><input id="name" maxlength="120" autocomplete="off"><label for="description">说明 <span style="color:#7b8178">（可选）</span></label><textarea id="description"></textarea><div id="workFields"><div class="fieldGrid"><div><label for="planStart">计划开始日期</label><input id="planStart" type="date"></div><div><label for="planEnd">计划结束日期</label><input id="planEnd" type="date"></div><div><label for="owner">责任人</label><input id="owner" placeholder="填写姓名" maxlength="80"></div><div><label for="status">状态</label><select id="status"><option value="notStarted">未开始</option><option value="working">进行中</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select></div></div></div><div id="formError" class="error" role="alert"></div><div class="actions"><button type="button" onclick="editor.close()">取消</button><button class="primary" id="save" type="submit">保存</button></div></form></dialog><div id="notice" role="status" aria-live="polite"></div><script>
const KEY='todo-pro-001-v1', names={goal:'目标',module:'模块',thing:'事情',event:'事件'}, parentType={module:'goal',thing:'module',event:'thing'};
const sample=()=>({revision:0,items:[{id:'g1',type:'goal',name:'让工作有序推进',description:'从清晰的目标，到可以完成的下一步。'},{id:'g2',type:'goal',name:'建立个人知识体系',description:'把零散的积累变成可复用的经验。'},{id:'m1',type:'module',parent:'g1',name:'产品从想法到落地',description:'把抽象的构想，逐步变成可以使用的产品。'},{id:'m2',type:'module',parent:'g1',name:'日常工作与沟通',description:'让每一次沟通都有明确的下一步。'},{id:'t1',type:'thing',parent:'m1',name:'打磨第一版工作闭环',description:'先让记录、组织和完成变得自然。'},{id:'t2',type:'thing',parent:'m1',name:'梳理典型使用场景',description:'从真实工作中找到产品的边界。'},{id:'e1',type:'event',parent:'t1',name:'体验目标到事件的创建流程',description:'试着新建一件事情，再为它记录一个具体行动。',done:false},{id:'e2',type:'event',parent:'t1',name:'检查事件完成后的展示',description:'点击左侧圆圈完成；再次点击可以撤销完成。',done:false},{id:'e3',type:'event',parent:'t1',name:'明确首个切片的范围',description:'聚焦手动组织工作与事件完成。',done:true}]});
const states={notStarted:'未开始',working:'进行中',completed:'已完成',cancelled:'已取消'};
const statusOf=x=>x.status||(x.done?'completed':'notStarted');
const pending=x=>['notStarted','working'].includes(statusOf(x));
function metadata(x){return `<div class="meta"><span class="status ${statusOf(x)}">${states[statusOf(x)]}</span><span>责任人 · ${esc(x.owner)||'未指定'}</span><span>计划开始 · ${esc(x.planStart?.slice(0,10))||'未设置'}</span><span>计划结束 · ${esc(x.planEnd?.slice(0,10))||'未设置'}</span></div>`}
let db,selection={goal:'g1',module:'m1',thing:'t1'},editing=null,busy=false;
try{db=JSON.parse(localStorage.getItem(KEY))||sample();if(!Array.isArray(db.items))throw Error();}catch{db=sample();setTimeout(()=>notify('本地数据读取失败，当前展示临时示例。'),100)}
const $=s=>document.querySelector(s), esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),get=id=>db.items.find(x=>x.id===id), children=(type,parent)=>db.items.filter(x=>x.type===type&&(!parent||x.parent===parent));
function notify(s){$('#notice').textContent=s;clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>$('#notice').textContent='',4500)}
function normalize(){for(const type of ['goal','module','thing']){let p=parentType[type];let list=db.items.filter(x=>x.type===type&&(!p||x.parent===selection[p]));if(!list.some(x=>x.id===selection[type]))selection[type]=list[0]?.id||null}}
function select(type,id){selection[type]=id;render()}
function dateText(v){return esc(v?.slice(0,10))||'未设置'}
function pill(x){return `<span class="status ${statusOf(x)}">${states[statusOf(x)]}</span>`}
function render(){
 normalize();let g=get(selection.goal),m=get(selection.module),t=get(selection.thing);
 $('#crumb').textContent='⌂  /  目标与事情'+(g?'  /  '+g.name:'')+(m?'  /  '+m.name:'');
 $('#goalSelect').innerHTML='<option value="" disabled>请选择目标</option>'+children('goal').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('#goalSelect').value=g?.id||'';
 $('#moduleSelect').innerHTML='<option value="" disabled>请选择模块</option>'+(g?children('module',g.id):[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('#moduleSelect').value=m?.id||'';
 $('#moduleSelect').disabled=!g;$('#newModule').disabled=!g;$('#editGoal').disabled=!g;$('#editModule').disabled=!m;$('#addThing').disabled=!m;
 let ts=m?children('thing',m.id):[];$('#thingCount').textContent=ts.length;
 $('#things').innerHTML=ts.length?ts.map(x=>`<button class="thing ${x.id===t?.id?'active':''}" onclick="select('thing','${x.id}')"><div class="cardTitle"><strong>${esc(x.name)}</strong>${pill(x)}</div><p>${esc(x.description)||'暂无说明'}</p><div class="cardMeta"><span>♙　责任人</span><b>${esc(x.owner)||'未指定'}</b><span>▦　计划开始</span><b>${dateText(x.planStart)}</b><span>▦　计划结束</span><b>${dateText(x.planEnd)}</b></div></button>`).join(''):`<div class="empty"><b>从一个目标开始</b>${m?'点击「新建事情」，组织你的行动。':g?'先创建一个模块。':'点击上方「新建目标」，开始规划。'}</div>`;
 if(!t){$('#events').innerHTML='<div class="empty"><b>让下一步更清晰</b>创建或选择一件事情，查看具体事件。</div>';return}
 let es=children('event',t.id);
 $('#events').innerHTML=`<div class="panelHead"><h2><i>▤</i> 当前事情</h2><span class="micro">FOCUS / ACTION</span></div><div class="detail"><div class="detailTitle"><div><h1>${esc(t.name)}</h1><p>${esc(t.description)||'为这件事情记录具体行动。'}</p></div><button onclick="openForm('thing','${t.id}')">♢ 编辑事情</button></div><div class="facts"><div><label>▦　计划开始日期</label><strong>${dateText(t.planStart)}</strong></div><div><label>▦　计划结束日期</label><strong>${dateText(t.planEnd)}</strong></div><div><label>♙　责任人</label><strong>${esc(t.owner)||'未指定'}</strong></div><div><label>◉　状态</label>${pill(t)}</div></div></div><div class="panelHead"><h2><i>☷</i> 事件清单 <small>${es.filter(pending).length} 待完成</small></h2><button class="primary" onclick="openForm('event')">＋ 新建事件</button></div><div class="tableWrap">${es.length?`<table><thead><tr><th>事件名称</th><th>计划开始日期</th><th>计划结束日期</th><th>责任人</th><th>状态</th><th>操作</th></tr></thead><tbody>${es.map(x=>`<tr><td><div class="eventName"><button class="check" ${statusOf(x)==='cancelled'?'disabled':''} aria-label="${statusOf(x)==='completed'?'撤销完成':'完成'}：${esc(x.name)}" onclick="toggle('${x.id}')">${statusOf(x)==='completed'?'✓':''}</button><div>${esc(x.name)}${x.description?`<small>${esc(x.description)}</small>`:''}</div></div></td><td>${dateText(x.planStart)}</td><td>${dateText(x.planEnd)}</td><td>${esc(x.owner)||'未指定'}</td><td>${pill(x)}</td><td><button class="quiet" onclick="openForm('event','${x.id}')">编辑</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty"><b>下一步，做什么？</b>点击「新建事件」，记录一个具体行动。</div>'}</div>`;
}
function openForm(type,id){let item=get(id),p=parentType[type],parent=p?selection[p]:null;if(!id&&p&&!get(parent)){notify('请先选择有效的'+names[p]);return}editing={type,id,parent,revision:db.revision};$('#formTitle').textContent=(id?'编辑':'新建')+names[type];$('#formContext').textContent=item?.parent?'所属'+names[p]+'：'+get(item.parent)?.name:parent?'所属'+names[p]+'：'+get(parent).name:'用一句话描述你希望达成的结果。';$('#name').value=item?.name||'';$('#description').value=item?.description||'';$('#workFields').hidden=!['thing','event'].includes(type);$('#planStart').value=item?.planStart?.slice(0,10)||'';$('#planEnd').value=item?.planEnd?.slice(0,10)||'';$('#owner').value=item?.owner||'';$('#status').value=item?statusOf(item):'notStarted';$('#formError').textContent='';$('#editor').showModal();$('#name').focus()}
function persist(next){let mode=$('#simulation').value;$('#simulation').value='';const errors={denied:'没有当前对象的操作权限，未保存。',missing:'父项已失效，请关闭后重新选择归属。',conflict:'内容状态已变化，请重新打开后编辑。',write:'保存失败，输入已保留，请核对后再试。',read:'无法确认保存结果，请先核对内容；本次演示未写入。'};if(mode)throw Error(errors[mode]);let old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.revision!==db.revision)throw Error('另一页面已修改数据，请刷新后重新操作。');next.revision=db.revision+1;let raw=JSON.stringify(next);localStorage.setItem(KEY,raw);if(localStorage.getItem(KEY)!==raw)throw Error('结果无法确认，请重新打开核对。');db=JSON.parse(raw)}
$('#form').onsubmit=e=>{e.preventDefault();if(busy||!editing)return;let name=$('#name').value.trim();if(!name){$('#formError').textContent='请输入名称，不能只包含空格。';$('#name').focus();return}if(['thing','event'].includes(editing.type)&&$('#planStart').value&&$('#planEnd').value&&$('#planEnd').value<$('#planStart').value){$('#formError').textContent='计划结束日期不能早于计划开始日期。';return}busy=true;$('#save').disabled=true;try{if(editing.revision!==db.revision)throw Error('内容已变化，请重新打开编辑。');let next=structuredClone(db),item=next.items.find(x=>x.id===editing.id);if(editing.id&&!item)throw Error('对象已失效，请重新选择。');if(!item&&parentType[editing.type]&&!get(editing.parent))throw Error('父项不存在，未保存。');if(item){item.name=name;item.description=$('#description').value}else{item={id:'n'+crypto.randomUUID(),type:editing.type,parent:editing.parent,name,description:$('#description').value,done:false};next.items.push(item)}if(['thing','event'].includes(editing.type)){item.planStart=$('#planStart').value;item.planEnd=$('#planEnd').value;item.owner=$('#owner').value.trim();item.status=$('#status').value;item.done=item.status==='completed'}persist(next);if(editing.type!=='event')selection[editing.type]=item.id;editing=null;$('#editor').close();render();notify('已保存，并核对本地结果。')}catch(err){$('#formError').textContent=err.message}finally{busy=false;$('#save').disabled=false}};
function toggle(id){try{let next=structuredClone(db),item=next.items.find(x=>x.id===id);if(!item||item.type!=='event'||item.parent!==selection.thing)throw Error('事件不在当前事情内。');if(statusOf(item)==='cancelled')throw Error('已取消事件请通过编辑调整状态。');item.status=statusOf(item)==='completed'?'notStarted':'completed';item.done=item.status==='completed';persist(next);render();notify(item.done?'事件已完成；所属事情保持不变。':'已撤销完成，恢复为未开始。')}catch(err){notify(err.message)}}
function switchDemo(empty){if(!confirm('这会替换当前浏览器中的原型演示数据，是否继续？'))return;try{let next=empty?{revision:0,items:[]}:sample();persist(next);selection={};render();notify(empty?'已进入空白空间。':'已恢复示例。')}catch(err){notify(err.message)}}render();
</script></body></html>
