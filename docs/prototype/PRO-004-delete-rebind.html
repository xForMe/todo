<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>删除与换绑原型</title><link rel="stylesheet" href="../../code/frontend/style.css"><body><main><h1>删除与换绑</h1><p>交互样例，不读写业务数据</p><button onclick="openDemo(0)">空目标</button><button onclick="openDemo(3)">有内容的模块</button><button onclick="openDemo(-1)">暂无接收位置</button><p id="result"></p></main><dialog id="drawer" aria-labelledby="title"><div class="drawerHead"><h2 id="title">删除模块</h2><button onclick="drawer.close()">取消</button></div><p id="summary"></p><label for="target">下级内容换绑到</label><select id="target" onchange="confirmButton.disabled=!this.value"><option value="">请选择接收位置</option><option value="b">交付目标 / 新模块</option></select><p id="hint"></p><div class="actions"><button id="confirmButton" onclick="result.textContent='样例操作完成，内容已保留';drawer.close()">换绑并删除</button></div></dialog><script>function openDemo(n){title.textContent=n===0?'删除空目标':'删除模块';summary.textContent=n===0?'没有下级内容，确认删除当前目标。':'3 件事情及其事件将整体转移，内容保留。';target.hidden=n===0;target.value='';target.disabled=n<0;confirmButton.disabled=n!==0;confirmButton.textContent=n===0?'确认删除':'换绑并删除';hint.textContent=n<0?'没有可用位置，请先创建另一个模块。':'目标换绑时同名模块融合，双方内容一起保留；关联来源和催办会暂停。';drawer.showModal()}</script></body></html>
