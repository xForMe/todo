<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRO-007 · 事情优先级与评估</title><link rel="stylesheet" href="PRO-003-tokens.css"><style>
:root{--card-bg:var(--surface);--control-bg:var(--surface-hover);--space:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 'Microsoft YaHei',sans-serif}button,select{font:inherit;color:inherit;background:var(--control-bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px;cursor:pointer}button:hover{border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{padding:24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:220px 1fr}aside{padding:24px;border-right:1px solid var(--line)}main{padding:32px;min-width:0;max-width:1400px}h1{font-size:28px;margin:0}h2{font-size:17px;margin:0 0 16px}.muted,small{color:var(--muted)}.bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:20px 0}.notice{border-left:3px solid var(--accent);background:var(--surface);padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cell{background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;min-height:180px}.item{display:block;width:100%;text-align:left;margin:10px 0;padding:16px}.item small{display:block}.tag{color:var(--accent)}dialog{position:fixed;margin:0 0 0 auto;inset:0;width:min(500px,100%);max-width:100%;height:100dvh;max-height:100dvh;border:0;border-left:1px solid var(--line);background:var(--surface);color:var(--text);padding:28px}dialog::backdrop{background:#0009}label{display:block;margin:24px 0}select{display:block;width:100%;margin-top:8px}.primary{background:var(--button-bg);color:var(--ink)}.error{color:var(--warning)}footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line)}@media(max-width:768px){.layout{display:block}aside{display:none}main{padding:16px}.grid{grid-template-columns:1fr}header{padding:16px}}
.workspace{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,1.6fr);gap:24px}.thing-row{padding:16px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}.thing-name{border:0;background:none;padding:0;font-weight:600;text-align:left}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{padding:3px 8px;font-size:12px}.event-row{padding:18px 0;border-top:1px solid var(--line)}.notice{padding:10px 16px;color:var(--muted);font-size:13px}@media(max-width:900px){.workspace{grid-template-columns:1fr}}</style><header><strong>TO DO / 工作组织</strong><span class="muted">PRO-007 · 交互草案 · 示例数据</span></header><div class="layout"><aside><h2>工作空间</h2><p>目标 / 模块 / 事情</p><p class="tag">燃气仿真</p><p>商务推进</p><hr><small>每周一次<br>应用内提醒<br>周期建议：周一开始</small></aside><main><small>目标与事情 / 燃气仿真 / 商务推进</small><h1>商务推进</h1><p class="muted">点击事情旁的优先级标签即可调整。</p><div class="notice" id="notice" role="status"></div><div class="bar"><label><input type="checkbox" id="dueOnly"> 仅本周待评估</label></div><div class="workspace"><section><h2>事情</h2><div id="board"></div></section><section class="cell"><h2 id="activeTitle">合同回款</h2><p class="muted">事件 · 原有事情工作区（示例）</p><div id="events"></div></section></div><footer><small>原型演示工具：修改仅留在本页内存中。</small><div class="bar"><button id="next">模拟下一周</button><label><input type="checkbox" id="fail"> 模拟保存失败</label></div></footer></main></div><dialog id="drawer" aria-labelledby="heading"><button id="close" aria-label="关闭抽屉">关闭</button><h2 id="heading"></h2><p id="path" class="muted"></p><label>事情优先级<select id="quadrant"></select></label><p class="muted">保持当前分类也可以确认本周评估。</p><p id="error" class="error" role="alert"></p><div class="bar"><button id="save">保存调整</button><button id="review" class="primary">保存并确认本周已评估</button></div></dialog><script>
const labels=['未评估','重要且紧急','重要不紧急','不重要但紧急','不重要不紧急'];let week=1,selected=null;
const items=[{name:'合同回款',path:'燃气仿真 / 商务推进',q:1,w:0,events:['核对付款节点 · 进行中','确认到账结果 · 未开始']},{name:'合同签约',path:'燃气仿真 / 商务推进',q:2,w:0,events:['确认合同版本 · 进行中']},{name:'客户资料整理',path:'燃气仿真 / 商务推进',q:0,w:0}];const $=id=>document.getElementById(id);function render(){const pending=items.filter(x=>x.w!==week).length;$('notice').textContent=`每周评估 · ${pending?'还有 '+pending+' 件事情待评估':'本周已完成'}`;$('board').replaceChildren();const rows=items.filter(x=>(!$('dueOnly').checked||x.w!==week));rows.forEach(x=>{const row=document.createElement('article');row.className='thing-row';const name=document.createElement('button');name.className='thing-name';name.textContent=x.name;name.onclick=()=>showEvents(x);const chips=document.createElement('div');chips.className='chips';[labels[x.q],x.w===week?'本周已评估':'待评估'].forEach(text=>{const b=document.createElement('button');b.className='chip';b.textContent=text;b.onclick=()=>openItem(x);chips.append(b)});row.append(name,chips);$('board').append(row)});if(!rows.length)$('board').textContent='暂无符合条件的事情';}
function showEvents(x){$('activeTitle').textContent=x.name;$('events').replaceChildren();(x.events||[]).forEach(text=>{const p=document.createElement('p');p.className='event-row';p.textContent=text;$('events').append(p)});if(!x.events?.length)$('events').textContent='暂无事件';}function openItem(x){selected=x;$('heading').textContent=x.name;$('path').textContent=x.path;$('quadrant').replaceChildren(...labels.map((name,i)=>{const o=document.createElement('option');o.value=i;o.textContent=name;return o}));$('quadrant').value=x.q;$('error').textContent='';$('drawer').showModal()}
function save(review){if($('fail').checked){$('error').textContent='保存失败（模拟），输入已保留，请手动重试。';return}const q=Number($('quadrant').value);if(review&&!q){$('error').textContent='请先选择优先级，再确认本周评估。';return}selected.q=q;if(review)selected.w=week;$('drawer').close();render()}
$('close').onclick=()=>$('drawer').close();$('save').onclick=()=>save(false);$('review').onclick=()=>save(true);$('next').onclick=()=>{week++;render()};$('dueOnly').onchange=render;render();
showEvents(items[0]);</script></html>
