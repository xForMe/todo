<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分层归属原型</title><link rel="stylesheet" href="../../code/frontend/style.css"><body><main><button onclick="drawer.showModal()">核对事件建议</button></main><dialog id="drawer"><div class="drawerHead"><h2>核对事件建议</h2><button onclick="drawer.close()">关闭</button></div><p>原文：智能输配原型下周一汇报</p><p class="sourceHint">AI 建议在智能输配模块下新建“原型评审”，请核对。</p><label>目标</label><select onchange="moduleSelect.value='';thing.value='' "><option>交付目标</option><option>其他目标</option></select><label>模块</label><select id="moduleSelect" onchange="moduleName.hidden=this.value!=='new';thing.value='' "><option value="">请选择模块</option><option>智能输配</option><option value="new">新建模块…</option></select><input id="moduleName" hidden placeholder="新模块名称"><label>事情</label><select id="thing" onchange="thingName.hidden=this.value!=='new'"><option value="">请选择事情</option><option>原型评审</option><option value="new">新建事情…</option></select><input id="thingName" hidden placeholder="新事情名称"><p>确认后才创建模块、事情和事件。</p><button onclick="drawer.close()">确认保存</button></dialog></body></html>
