<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>行间 · 目标与行动</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><nav class="navGroup" aria-label="主导航"><button disabled title="后续规划，当前仅展示导航">▦ 工作台</button><button class="active" aria-current="page">◎ 目标与事情</button><button disabled title="后续规划">▤ 事件管理</button></nav><div class="brand"><strong>行间 · 目标与行动</strong><small>WORK WITH INTENTION</small></div><nav class="navGroup" aria-label="系统导航"><button disabled title="后续规划">▱ 资料中心</button><button disabled title="后续规划">⚙ 系统设置</button><button disabled title="个人空间展示占位">♙ 个人空间</button></nav></header><main><div class="breadcrumb" id="crumb"></div><section class="toolbar" aria-label="选择目标和模块"><label for="goalSelect">目标</label><select id="goalSelect" onchange="select('goal',this.value)"></select><button class="quiet" id="editGoal" onclick="openForm('goal',selection.goal)" aria-label="编辑当前目标">编辑</button><label for="moduleSelect">模块</label><select id="moduleSelect" onchange="select('module',this.value)"></select><button class="quiet" id="editModule" onclick="openForm('module',selection.module)" aria-label="编辑当前模块">编辑</button><span class="spacer"></span><button class="primary" onclick="openForm('goal')">＋ 新建目标</button><button id="newModule" onclick="openForm('module')">＋ 新建模块</button></section><div class="workspace"><section class="panel"><div class="panelHead"><h2><i>▱</i> 事情 <small id="thingCount"></small></h2><button id="addThing" onclick="openForm('thing')">＋ 新建事情</button></div><div id="things"></div></section><section class="panel" id="events"></section></div><footer>个人工作空间</footer><section class="toolbar"><button onclick="connect()">连接 / 刷新</button><button onclick="checkPending()">核对待确认操作</button><span>计划时间：Asia/Shanghai</span></section></main><dialog id="editor"><form id="form" novalidate><h2 id="formTitle"></h2><p id="formContext"></p><label for="name">名称 <span style="color:#a43e2f">*</span></label><input id="name" maxlength="120" autocomplete="off"><label for="description">说明 <span style="color:#7b8178">（可选）</span></label><textarea id="description"></textarea><div id="workFields"><div class="fieldGrid"><div><label for="planStart">计划开始时间</label><input id="planStart" type="datetime-local"></div><div><label for="planEnd">计划结束时间</label><input id="planEnd" type="datetime-local"></div><div><label for="owner">责任人</label><input id="owner" placeholder="填写姓名" maxlength="80"></div><div><label for="status">状态</label><select id="status"><option value="notStarted">未开始</option><option value="working">进行中</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select></div></div></div><div id="formError" class="error" role="alert"></div><div class="actions"><button type="button" onclick="editor.close()">取消</button><button class="primary" id="save" type="submit">保存</button></div></form></dialog><div id="notice" role="status" aria-live="polite"></div><script src="/app.js?v=3" defer></script></body></html>
